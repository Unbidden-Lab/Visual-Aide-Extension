<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-row">
        <div class="brand-group">
          <h1>VISUAL AIDE</h1>
          <span class="shortcut-tag" title="Toggle shortcut: Alt+Shift+V">Alt+Shift+V</span>
        </div>
        <label class="toggle-switch" title="Toggle Visual Aide">
          <input type="checkbox" id="master-toggle" checked aria-label="Toggle Visual Aide on or off">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="subheader-row">
        <p class="subtitle" id="status-text">System active.</p>
        <button id="reset-btn" class="reset-btn" title="Reset all settings to default" aria-label="Reset all settings to default">Reset</button>
      </div>

      <!-- Quick Launch PDF Reader -->
      <button id="open-reader-btn" class="reader-launch-btn" title="Open accessible PDF Reader studio">
        Open Accessible PDF Reader
      </button>
    </header>

    <div id="controls-container">
      <!-- Presets -->
      <div class="section-title">
        Severity Presets
        <button type="button" class="info-help-btn" data-tooltip-title="Severity Presets" data-tooltip-desc="One-click visual accommodation profiles for reading comfort" aria-label="Learn about Severity Presets">?</button>
      </div>
      <div class="level-group" role="group" aria-label="Severity presets">
        <button class="level-btn" data-level="1" aria-pressed="false">L1: Mild</button>
        <button class="level-btn" data-level="2" aria-pressed="false">L2: Mod</button>
        <button class="level-btn" data-level="3" aria-pressed="false">L3: Max</button>
      </div>

      <!-- Typography & Color Contrast -->
      <div class="section-header">
        <span class="section-title">Typography &amp; Contrast</span>
      </div>

      <div class="control-card">
        <div class="slider-group">
          <label for="font-family">
            Typeface
            <button type="button" class="info-help-btn" data-tooltip-title="Typeface" data-tooltip-desc="Dyslexia-friendly and high-legibility fonts" aria-label="Learn about Typeface">?</button>
          </label>
          <select id="font-family" class="custom-select">
            <option value="OpenDyslexic">OpenDyslexic (Specialized)</option>
            <option value="Lexend">Lexend (Reading Fluency)</option>
            <option value="'Atkinson Hyperlegible'">Atkinson Hyperlegible (Clear)</option>
            <option value="Verdana, Geneva, sans-serif">Verdana (Wide Sans)</option>
            <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
            <option value="'Comic Sans MS', 'Comic Sans', cursive">Comic Sans (Legible)</option>
            <option value="system-ui, -apple-system, sans-serif">System Clean</option>
            <option value="inherit">Website Default</option>
          </select>
        </div>

        <!-- Font Color Selection -->
        <div class="slider-group">
          <label for="font-color">
            Font Color
            <button type="button" class="info-help-btn" data-tooltip-title="Font Color" data-tooltip-desc="High-contrast text shades for optimal legibility" aria-label="Learn about Font Color">?</button>
          </label>
          <select id="font-color" class="custom-select">
            <option value="default">Default</option>
            <option value="#111111">Deep Black (#111111)</option>
            <option value="#2d2d2d">Soft Charcoal (#2d2d2d)</option>
            <option value="#0f1f38">Deep Navy (#0f1f38)</option>
            <option value="#ffd796">Warm Amber (#ffd796)</option>
            <option value="#ffffff">Pure White (#ffffff)</option>
          </select>
        </div>

        <!-- Irlen Color Contrast Presets -->
        <div class="slider-group">
          <label for="contrast-mode">
            Color Contrast (Irlen Support)
            <button type="button" class="info-help-btn" data-tooltip-title="Color Contrast" data-tooltip-desc="Soothing background tints to reduce visual stress and glare" aria-label="Learn about Color Contrast">?</button>
          </label>
          <select id="contrast-mode" class="custom-select">
            <option value="default">Website Default</option>
            <option value="cream">Soft Cream (Dark on Warm Amber)</option>
            <option value="peach">Warm Peach (Dark on Soft Peach)</option>
            <option value="mint">Calm Mint (Dark on Soft Mint)</option>
            <option value="navy">Navy Night (Amber on Deep Navy)</option>
            <option value="dark">Charcoal Dark (Light on Dark)</option>
            <option value="inverted">High Contrast Inverted (Yellow on Black)</option>
          </select>
        </div>

                <!-- Font Size Slider -->
        <div class="slider-group">
          <div class="label-row">
            <label for="font-size">
              Font Size
              <button type="button" class="info-help-btn" data-tooltip-title="Font Size" data-tooltip-desc="Scales reading text proportionally across the page" aria-label="Learn about Font Size">?</button>
            </label>
            <span class="val-badge" id="font-size-val">100%</span>
          </div>
          <input type="range" id="font-size" min="90" max="160" step="5" value="100" aria-label="Font size slider">
        </div>

        <!-- Collapsible Advanced Typography Spacing Accordion -->
        <details class="advanced-accordion" id="advanced-spacing-details">
          <summary class="advanced-summary">
            <span class="advanced-summary-title">
              Advanced Typography Spacing
              <button type="button" class="info-help-btn" data-tooltip-title="Typography Spacing" data-tooltip-desc="Fine-tune character, word, line, and paragraph spacing" aria-label="Learn about Advanced Typography Spacing">?</button>
            </span>
            <span class="advanced-summary-chevron"></span>
          </summary>
          <div class="advanced-content">
            <!-- Tracking (Letter Space) -->
            <div class="slider-group">
              <div class="label-row">
                <label for="tracking">
                  Tracking (Letter Space)
                  <button type="button" class="info-help-btn" data-tooltip-title="Letter Tracking" data-tooltip-desc="Expands character spacing to prevent letter crowding" aria-label="Learn about Tracking">?</button>
                </label>
                <span class="val-badge" id="tracking-val">0px</span>
              </div>
              <input type="range" id="tracking" min="0" max="6" step="0.25" value="0">
            </div>

            <!-- Spacing (Word Space) -->
            <div class="slider-group">
              <div class="label-row">
                <label for="spacing">
                  Spacing (Word Space)
                  <button type="button" class="info-help-btn" data-tooltip-title="Word Spacing" data-tooltip-desc="Widens spacing between words to enhance separation" aria-label="Learn about Word Spacing">?</button>
                </label>
                <span class="val-badge" id="spacing-val">0px</span>
              </div>
              <input type="range" id="spacing" min="0" max="12" step="0.5" value="0">
            </div>

            <!-- Leading (Line Height) -->
            <div class="slider-group">
              <div class="label-row">
                <label for="leading">
                  Leading (Line Height)
                  <button type="button" class="info-help-btn" data-tooltip-title="Line Height (Leading)" data-tooltip-desc="Increases vertical line spacing to prevent line skipping" aria-label="Learn about Line Height">?</button>
                </label>
                <span class="val-badge" id="leading-val">1.5x</span>
              </div>
              <input type="range" id="leading" min="1.0" max="2.8" step="0.1" value="1.5">
            </div>

            <!-- Paragraph Spacing -->
            <div class="slider-group">
              <div class="label-row">
                <label for="paragraph-spacing">
                  Paragraph Spacing
                  <button type="button" class="info-help-btn" data-tooltip-title="Paragraph Spacing" data-tooltip-desc="Adds breathing room between paragraphs" aria-label="Learn about Paragraph Spacing">?</button>
                </label>
                <span class="val-badge" id="paragraph-spacing-val">0px</span>
              </div>
              <input type="range" id="paragraph-spacing" min="0" max="24" step="2" value="0">
            </div>
          </div>
        </details>

        <!-- Left Align Toggle -->
        <div class="switch-row">
          <div class="switch-info">
            <span class="switch-title">
              Left-Align Text
              <button type="button" class="info-help-btn" data-tooltip-title="Left-Align Text" data-tooltip-desc="Eliminates uneven word rivers and justification artifacts" aria-label="Learn about Left-Align Text">?</button>
            </span>
          </div>
          <label class="toggle-switch small">
            <input type="checkbox" id="left-align-toggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <!-- Focus & Sensory Interventions -->
      <div class="section-header">
        <span class="section-title">Focus &amp; Sensory Aids</span>
      </div>

      <div class="control-card">
        <!-- Bionic Reading Toggle -->
        <div class="switch-row">
          <div class="switch-info">
            <span class="switch-title">
              Bionic Reading
              <button type="button" class="info-help-btn" data-tooltip-title="Bionic Reading" data-tooltip-desc="Bolds initial word fixations to guide saccadic eye flow" aria-label="Learn about Bionic Reading">?</button>
            </span>
          </div>
          <label class="toggle-switch small">
            <input type="checkbox" id="bionic-toggle">
            <span class="toggle-slider"></span>
          </label>
        </div>


        <!-- Glare Tint Overlay -->
        <div class="divider"></div>
        <div class="slider-group">
          <div class="label-row">
            <label for="overlay">
              Glare Tint Intensity
              <button type="button" class="info-help-btn" data-tooltip-title="Glare Tint" data-tooltip-desc="Full-screen color overlay to ease sensory overload" aria-label="Learn about Glare Tint">?</button>
            </label>
            <span class="val-badge" id="overlay-val">0%</span>
          </div>
          <input type="range" id="overlay" min="0" max="0.75" step="0.05" value="0">
        </div>

        <div class="tint-palette-group">
          <span class="sub-label">
            Tint Spectrum
            <button type="button" class="info-help-btn" data-tooltip-title="Tint Spectrum" data-tooltip-desc="Spectral filter hues to alleviate optical distortions" aria-label="Learn about Tint Spectrum">?</button>
          </span>
          <div class="color-chips" id="tint-palette">
            <button type="button" class="color-chip active" data-color="amber" style="--chip-color: #ffd796;" title="Warm Amber"></button>
            <button type="button" class="color-chip" data-color="peach" style="--chip-color: #ffcdb4;" title="Warm Peach"></button>
            <button type="button" class="color-chip" data-color="rose" style="--chip-color: #ffc3cd;" title="Soft Rose"></button>
            <button type="button" class="color-chip" data-color="mint" style="--chip-color: #bef0d2;" title="Mint Green"></button>
            <button type="button" class="color-chip" data-color="blue" style="--chip-color: #bee1ff;" title="Sky Blue"></button>
            <button type="button" class="color-chip" data-color="lavender" style="--chip-color: #e1d2ff;" title="Lavender"></button>
            <button type="button" class="color-chip" data-color="cream" style="--chip-color: #fffacd;" title="Soft Cream"></button>
          </div>
        </div>

        <!-- Reading Ruler & Mask -->
        <div class="divider"></div>
        <div class="switch-row">
          <div class="switch-info">
            <span class="switch-title">
              Reading Guide
              <button type="button" class="info-help-btn" data-tooltip-title="Reading Guide" data-tooltip-desc="Cursor-guided focus bar or reading mask" aria-label="Learn about Reading Guide">?</button>
            </span>
          </div>
          <label class="toggle-switch small">
            <input type="checkbox" id="ruler-toggle">
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div id="ruler-options" class="nested-options hidden">
          <div class="segmented-control" role="radiogroup" aria-label="Ruler display mode">
            <button type="button" class="segment-btn active" data-ruler-mode="bar" role="radio" aria-checked="true">Focus Bar</button>
            <button type="button" class="segment-btn" data-ruler-mode="mask" role="radio" aria-checked="false">Reading Mask</button>
          </div>
          <div class="slider-group" style="margin-top: 10px;">
            <div class="label-row">
              <label for="ruler-height">
                Guide Slot Height
                <button type="button" class="info-help-btn" data-tooltip-title="Guide Slot Height" data-tooltip-desc="Height of the visible focus reading band" aria-label="Learn about Guide Slot Height">?</button>
              </label>
              <span class="val-badge" id="ruler-height-val">40px</span>
            </div>
            <input type="range" id="ruler-height" min="20" max="80" step="5" value="40">
          </div>
        </div>

        <!-- Read Aloud Text-to-Speech Voice -->
        <div class="divider"></div>
        <div class="slider-group">
          <div class="label-row">
            <label for="tts-voice">
              Read Aloud Voice
              <button type="button" class="info-help-btn" data-tooltip-title="Read Aloud Voice" data-tooltip-desc="Choose female (Aria) or male (Guy) natural neural voice for reading text aloud" aria-label="Learn about Read Aloud Voice">?</button>
            </label>
            <button type="button" id="tts-voice-test-btn" class="voice-test-btn" title="Preview speech voice" aria-label="Preview speech voice">Test Voice</button>
          </div>
          <select id="tts-voice" class="custom-select">
            <option value="female">Female (Aria)</option>
            <option value="male">Male (Guy)</option>
          </select>
        </div>

        <!-- Speech Speed Multiplier -->
        <div class="slider-group" style="margin-top: 10px;">
          <div class="label-row">
            <label for="tts-speed">
              Speech Speed
              <button type="button" class="info-help-btn" data-tooltip-title="Speech Speed" data-tooltip-desc="Adjust reading rate multiplier from slower to faster speech" aria-label="Learn about Speech Speed">?</button>
            </label>
          </div>
          <select id="tts-speed" class="custom-select">
            <option value="0.75">0.75x</option>
            <option value="0.9">0.9x</option>
            <option value="1.0">1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
          </select>
        </div>

      </div>
    </div>
  </div>
  <!-- Floating Info Tooltip -->
  <div id="popup-tooltip" class="popup-tooltip" role="tooltip" aria-hidden="true"></div>

  <script src="popup.js"></script>
</body>
</html>
